<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/sis/public/favicon.ico?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULearn LMS — Sign in</title>
<style>
  :root {
    --green: #339900;
    --green-dark: #226600;
    --ink: #111827;
    --bg: #f4f3f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--ink);
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.08);
  }
  .brand {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
    text-align: center;
  }
  .brand .u { color: var(--green); }
  .sub {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fafafa;
  }
  input:focus { outline: none; border-color: var(--green); background: white; }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: var(--green-dark); }
  button:disabled { background: #9ca3af; cursor: wait; }
  .msg {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .msg.err { color: #b91c1c; }
  .msg.ok  { color: var(--green-dark); }
  .footer {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
  }
  .footer a { color: #6b7280; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="u">U</span>Learn LMS</div>
    <div class="sub">Sign in to access your classes</div>

    <form id="f" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit" id="btn">Sign in</button>
      <div class="msg" id="msg" role="status"></div>
    </form>

    <div class="footer">
      Trouble signing in? Ask the office.
    </div>
  </div>

<script>
const RETURN_URL = new URLSearchParams(location.search).get('return') || 'https://lms.ulearnschool.com/prototype/lms/today.html';
const f   = document.getElementById('f');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Signing in…';
  try {
    const r = await fetch('/sis/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const body = await r.json();
    if (!body.success) throw new Error(body.error || 'Sign-in failed');
    msg.className = 'msg ok'; msg.textContent = '✓ Signed in — redirecting…';
    location.href = RETURN_URL;
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
