<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ULearn · Group Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --g:#339900; --g2:#2a7d00; --ink:#1a1a2e; --mut:#6b7280; --line:#e5e7eb; --bad:#dc2626; --warn:#d97706; --bg:#f4f6f3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
  header { background: var(--g); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  header b { font-size: 17px; font-weight: 800; }
  header .meta { margin-left: auto; font-size: 13px; opacity: .92; text-align: right; }
  .lang { display: flex; gap: 2px; }
  .lang button { border: 1px solid rgba(255,255,255,.6); background: none; color: #fff; font: 700 11px Inter, sans-serif; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
  .lang button.on { background: #fff; color: var(--g2); }
  main { max-width: 1240px; margin: 0 auto; padding: 10px 16px 40px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .up { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: 0; border-radius: 8px; padding: 10px 14px; font: 700 14px Inter, sans-serif; cursor: pointer; background: var(--g); color: #fff; }
  .btn.alt { background: #fff; color: var(--g2); border: 1.5px solid var(--g); }
  .btn:disabled { opacity: .5; cursor: default; }
  .drop { flex: 1 1 220px; border: 1.5px dashed #b9c4b1; border-radius: 8px; padding: 10px; color: var(--mut); text-align: center; font-size: 13px; }
  .drop.on { border-color: var(--g); background: #eef7e8; color: var(--g2); }
  #prog { font-size: 13px; color: var(--g2); font-weight: 600; margin-top: 6px; min-height: 0; }
  #prog .err { color: var(--bad); display: block; font-weight: 600; }
  .count { font-weight: 800; }
  .hd, .m { display: grid; grid-template-columns: 1fr 1fr .45fr .95fr .75fr 1.15fr .95fr .95fr 1.15fr 58px; gap: 6px; align-items: center; }
  .hd { font-size: 11px; font-weight: 700; color: var(--mut); text-transform: uppercase; padding: 0 12px 4px; }
  .m { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin-bottom: 5px; }
  .m.leader { border-left: 4px solid #7c3aed; }
  .m input, .m select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; font: 13px Inter, sans-serif; color: var(--ink); background: #fff; min-width: 0; }
  .m input.miss, .m select.miss { border-color: var(--bad); background: #fef2f2; }
  .m input.soon { border-color: var(--warn); background: #fffbeb; }
  .m .act { display: flex; gap: 4px; justify-content: flex-end; }
  .ic { border: 0; background: none; cursor: pointer; font-size: 16px; padding: 2px 4px; color: var(--mut); }
  .ic:hover { color: var(--ink); }
  .lbl { display: none; }
  .empty { color: var(--mut); text-align: center; padding: 18px; }
  .legend { font-size: 12px; color: var(--mut); margin: 6px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 3px 0 10px; }
  @media (max-width: 760px) {
    header .meta { font-size: 12px; }
    .hd { display: none; }
    .m { grid-template-columns: 1fr 1fr; padding: 8px 10px; }
    .lbl { display: block; font-size: 10px; font-weight: 700; color: var(--mut); text-transform: uppercase; margin-bottom: 1px; }
    .m .act { align-self: end; justify-content: flex-end; gap: 14px; padding-bottom: 6px; }
    .m { gap: 4px 8px; }
  }
</style>
</head>
<body>
<header><b>ULearn</b><span id="gname"></span><div class="meta" id="gmeta"></div><div class="lang"><button data-l="it">IT</button><button data-l="en">EN</button></div></header>
<main>
  <div class="card">
    <div class="up">
      <button class="btn" id="bStu" data-t="addStu"></button>
      <button class="btn alt" id="bLead" data-t="addLead"></button>
      <div class="drop" id="drop" data-t="drop"></div>
    </div>
    <div id="prog"></div>
    <input type="file" id="fStu" accept="image/*,application/pdf" multiple hidden>
    <input type="file" id="fLead" accept="image/*,application/pdf" multiple hidden>
    <input type="file" id="fOne" accept="image/*,application/pdf" multiple hidden>
  </div>
  <div class="legend"><span class="count" id="cnt"></span> <i style="background:#fef2f2;border:1px solid var(--bad)"></i><span data-t="lgMiss"></span> <i style="background:#fffbeb;border:1px solid var(--warn)"></i><span data-t="lgSoon"></span> <i style="background:#7c3aed"></i><span data-t="leader"></span></div>
  <div class="hd"><span data-t="given"></span><span data-t="surname"></span><span data-t="sex"></span><span data-t="dob"></span><span data-t="nat"></span><span data-t="doc"></span><span data-t="docNo"></span><span data-t="expiry"></span><span data-t="role"></span><span></span></div>
  <div id="list"></div>
</main>
<script>
const TOKEN = location.pathname.split('/').filter(Boolean).pop();
const API = `/sis/group/${TOKEN}/api`;
let DATA = { group: {}, members: [] };
// English / Italian (Neil 2026-11-20: Italian groups). Browser language picks the default; the IT/EN switch overrides.
const TXT = {
  en: { addStu: 'Add Students', addLead: 'Add Leaders', drop: 'Or drop passports / ID cards here (photo or PDF, both sides of ID cards)',
    lgMiss: 'Missing', lgSoon: 'Expires within 3 months of the trip', leader: 'Leader', student: 'Student',
    surname: 'Surname', given: 'Given Names', sex: 'Sex', dob: 'Birth Date', nat: 'Nationality', doc: 'Document', docNo: 'Document No.', expiry: 'Expiry', role: 'Role',
    passport: 'Passport', idCard: 'ID Card', upOne: 'Upload this person’s passport / ID card', upHave: 'Document received — upload again to replace the details', remove: 'Remove', none: 'No documents yet.',
    dead: 'This link is no longer active. Please contact ULearn.', arrival: 'Arrival',
    students: n => `${n} student${n === 1 ? '' : 's'}`, leaders: n => `${n} leader${n === 1 ? '' : 's'}`, of: 'of', toCheck: n => `${n} to check`, allOk: 'all complete',
    reading: (i, n) => `Reading document ${i} of ${n}…`, added: n => `Added ${n}`, matchedName: n => `${n} matched to names already on the list`,
    sameDoc: n => `${n} matched to people already on the list`, unread: n => `${n} couldn’t be read, please type those in`,
    removeQ: name => `Remove ${name}?`, thisPerson: 'this person', upFail: 'upload failed', saveFail: 'Save failed',
    soonTip: 'Expires within 3 months of the end of the trip — many airlines and borders refuse this',
    BAD_TYPE: 'Please upload a photo (JPG/PNG) or a PDF' },
  it: { addStu: 'Aggiungi Studenti', addLead: 'Aggiungi Accompagnatori', drop: 'Oppure trascina qui passaporti / carte d’identità (foto o PDF, fronte e retro della carta)',
    lgMiss: 'Mancante', lgSoon: 'Scade entro 3 mesi dal viaggio', leader: 'Accompagnatore', student: 'Studente',
    surname: 'Cognome', given: 'Nome', sex: 'Sesso', dob: 'Data Nascita', nat: 'Nazionalità', doc: 'Documento', docNo: 'Numero', expiry: 'Scadenza', role: 'Ruolo',
    passport: 'Passaporto', idCard: 'Carta d’Identità', upOne: 'Carica passaporto / carta d’identità di questa persona', upHave: 'Documento ricevuto — ricarica per aggiornare i dati', remove: 'Rimuovi', none: 'Nessun documento ancora.',
    dead: 'Questo link non è più attivo. Contatta ULearn.', arrival: 'Arrivo',
    students: n => `${n} student${n === 1 ? 'e' : 'i'}`, leaders: n => `${n} accompagnator${n === 1 ? 'e' : 'i'}`, of: 'su', toCheck: n => `${n} da controllare`, allOk: 'tutto completo',
    reading: (i, n) => `Lettura documento ${i} di ${n}…`, added: n => `Aggiunti ${n}`, matchedName: n => `${n} abbinati a nomi già in elenco`,
    sameDoc: n => `${n} abbinati a persone già in elenco`, unread: n => `${n} non leggibili, inserisci i dati a mano`,
    removeQ: name => `Rimuovere ${name}?`, thisPerson: 'questa persona', upFail: 'caricamento non riuscito', saveFail: 'Salvataggio non riuscito',
    soonTip: 'Scade entro 3 mesi dalla fine del viaggio — molte compagnie aeree e frontiere lo rifiutano',
    BAD_TYPE: 'Carica una foto (JPG/PNG) o un PDF' },
};
let LANG = (() => { try { const l = localStorage.getItem('grpLang'); if (l) return l; } catch (e) {} return /^it/i.test(navigator.language || '') ? 'it' : 'en'; })();
const t = k => TXT[LANG][k] ?? TXT.en[k] ?? k;
const tErr = e => TXT[LANG][e] || e;
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem('grpLang', LANG); } catch (e) {} applyLang(); render(); });
applyLang();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString(LANG === 'it' ? 'it-IT' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '';

async function load() {
  const r = await fetch(API, { cache: 'no-store' }); const j = await r.json();
  if (!j.success) { document.querySelector('main').innerHTML = `<div class="card empty">${t('dead')}</div>`; return; }
  DATA = j; render();
}
function render() {
  const g = DATA.group, ms = DATA.members.slice().sort((a, b) => (a.role === b.role ? 0 : a.role === 'leader' ? -1 : 1) || (a.lastName || '~').localeCompare(b.lastName || '~'));
  document.getElementById('gname').textContent = g.name || '';
  document.getElementById('gmeta').textContent = g.arrival ? `${t('arrival')} ${fmt(g.arrival)}` : '';
  const leaders = ms.filter(m => m.role === 'leader').length, students = ms.length - leaders;
  const todo = ms.filter(m => m.missing.length || m.expiresSoon).length;
  document.getElementById('cnt').textContent = `${t('students')(students)}${g.pax ? ` ${t('of')} ${g.pax}` : ''} · ${t('leaders')(leaders)}${todo ? ` · ${t('toCheck')(todo)}` : ms.length ? ` · ${t('allOk')}` : ''}`;
  const f = (m, k, label, type, extra = '') => {
    const cls = m.missing.includes(k) ? 'miss' : (k === 'passportExpiry' && m.expiresSoon ? 'soon' : '');
    return `<div><span class="lbl">${label}</span><input class="${cls}" type="${type}" data-k="${k}" data-b="${m.bookingId}" value="${esc(m[k] || '')}" ${extra}></div>`;
  };
  document.getElementById('list').innerHTML = ms.length ? ms.map(m => `
    <div class="m ${m.role === 'leader' ? 'leader' : ''}">
      ${f(m, 'firstName', t('given'), 'text')}${f(m, 'lastName', t('surname'), 'text')}
      <div><span class="lbl">${t('sex')}</span><select data-k="sex" data-b="${m.bookingId}" class="${m.missing.includes('sex') ? 'miss' : ''}"><option value=""></option><option ${m.sex === 'F' ? 'selected' : ''}>F</option><option ${m.sex === 'M' ? 'selected' : ''}>M</option></select></div>
      ${f(m, 'dob', t('dob'), 'date')}${f(m, 'nationality', t('nat'), 'text')}
      <div><span class="lbl">${t('doc')}</span><select data-k="docType" data-b="${m.bookingId}"><option value=""></option><option value="passport" ${m.docType === 'passport' ? 'selected' : ''}>${t('passport')}</option><option value="id_card" ${m.docType === 'id_card' ? 'selected' : ''}>${t('idCard')}</option></select></div>
      ${f(m, 'passportNumber', t('docNo'), 'text', 'style="text-transform:uppercase"')}${f(m, 'passportExpiry', t('expiry'), 'date', m.expiresSoon ? `title="${esc(t('soonTip'))}"` : '')}
      <div><span class="lbl">${t('role')}</span><select data-k="role" data-b="${m.bookingId}"><option value="student" ${m.role !== 'leader' ? 'selected' : ''}>${t('student')}</option><option value="leader" ${m.role === 'leader' ? 'selected' : ''}>${t('leader')}</option></select></div>
      <div class="act"><button class="ic up1 ${m.docIds && m.docIds.length ? 'have' : ''}" title="${esc(t(m.docIds && m.docIds.length ? 'upHave' : 'upOne'))}" onclick="pickFor(${m.bookingId})">${m.docIds && m.docIds.length ? '✅' : '📎'}</button><button class="ic" title="${esc(t('remove'))}" onclick="del(${m.bookingId})">✕</button></div>
    </div>`).join('') : `<div class="card empty">${t('none')}</div>`;
}
document.getElementById('list').addEventListener('change', async e => {
  const el = e.target; if (!el.dataset.k) return;
  el.disabled = true;
  try {
    const r = await fetch(`${API}/members/${el.dataset.b}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [el.dataset.k]: el.value }) });
    const j = await r.json(); if (!j.success) throw new Error(j.error || t('saveFail'));
    await load();
  } catch (err) { alert(err.message || err); el.disabled = false; }
});
async function del(id) {
  const m = DATA.members.find(x => x.bookingId === id);
  if (!confirm(t('removeQ')([m?.firstName, m?.lastName].filter(Boolean).join(' ') || t('thisPerson')))) return;
  await fetch(`${API}/members/${id}`, { method: 'DELETE' }); load();
}
let ROW = null;
function pickFor(bookingId) { ROW = bookingId; document.getElementById('fOne').click(); }
document.getElementById('fOne').onchange = e => { uploadAll(e.target.files, null, ROW); e.target.value = ''; };
async function uploadAll(files, role, bookingId) {
  files = [...files].filter(f => /^image\/|pdf$/.test(f.type) || /\.(jpe?g|png|heic|heif|webp|pdf)$/i.test(f.name));
  if (!files.length) return;
  const prog = document.getElementById('prog'), btns = document.querySelectorAll('.btn');
  btns.forEach(b => b.disabled = true);
  const errs = []; let added = 0, same = 0, unread = 0, matched = 0;
  for (let i = 0; i < files.length; i++) {
    prog.innerHTML = t('reading')(i + 1, files.length);
    const fd = new FormData(); if (role) fd.append('role', role); if (bookingId) fd.append('bookingId', bookingId); fd.append('file', files[i]);
    try {
      const r = await fetch(`${API}/passport`, { method: 'POST', body: fd }); const j = await r.json();
      if (!j.success) errs.push(`${files[i].name}: ${tErr(j.error)}`);
      else if (j.matched === 'passport' || j.matched === 'row') same++;
      else if (j.matched) matched++;
      else { added++; if (!j.read) unread++; }
    } catch (e) { errs.push(`${files[i].name}: ${t('upFail')}`); }
    if ((i + 1) % 5 === 0) load();
  }
  btns.forEach(b => b.disabled = false);
  prog.innerHTML = [t('added')(added), matched && t('matchedName')(matched), same && t('sameDoc')(same), unread && t('unread')(unread)].filter(Boolean).map(esc).join(' · ') + errs.map(e => `<span class="err">${esc(e)}</span>`).join('');
  load();
}
document.getElementById('bStu').onclick = () => document.getElementById('fStu').click();
document.getElementById('bLead').onclick = () => document.getElementById('fLead').click();
document.getElementById('fStu').onchange = e => { uploadAll(e.target.files, 'student'); e.target.value = ''; };
document.getElementById('fLead').onchange = e => { uploadAll(e.target.files, 'leader'); e.target.value = ''; };
const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', e => uploadAll(e.dataTransfer.files, 'student'));
load();
</script>
</body>
</html>
