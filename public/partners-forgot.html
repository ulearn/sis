<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/sis/public/favicon.ico?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULearn — Partner Portal Password Reset</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f3f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    padding: 44px 40px 36px;
  }
  .logo {
    text-align: center;
    margin-bottom: 6px;
    font-size: 24px;
    font-weight: 800;
    color: #1a1d23;
    letter-spacing: -0.02em;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #339900;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .intro {
    text-align: center;
    font-size: 13px;
    color: #64748b;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: #339900;
    box-shadow: 0 0 0 4px rgba(51, 153, 0, 0.08);
  }
  button {
    width: 100%;
    padding: 13px;
    background: #339900;
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    box-shadow: 0 8px 20px rgba(51, 153, 0, 0.25);
    margin-top: 6px;
  }
  button:hover { background: #2d8600; transform: translateY(-1px); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .success {
    background: #d1fae5;
    color: #065f46;
    padding: 16px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }
  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #9b9ea6;
  }
  .footer-note a { color: #339900; text-decoration: none; font-weight: 600; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="logo">ULearn</div>
  <div class="subtitle">Partner Portal — Reset Password</div>
  <div class="intro">Enter your email. If we find an account, we'll send a reset link.</div>

  <div class="success" id="success">
    If your email matches an account, a reset link has been sent. Check your inbox.
  </div>

  <form id="forgotForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required autofocus>
    </div>
    <!-- honeypot — bots fill this, humans don't -->
    <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">
    <button type="submit" id="submitBtn">Send Reset Link</button>
  </form>

  <div class="footer-note">
    <a href="/sis/partners/login">← Back to sign in</a>
  </div>
</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    // Reuse the existing SIS forgot endpoint — sis_users table is shared.
    await fetch('/sis/auth/forgot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim().toLowerCase(),
        website: '',
        portal: 'partners',
      }),
    });
    document.getElementById('success').style.display = 'block';
    document.getElementById('forgotForm').style.display = 'none';
  } catch (err) {
    document.getElementById('success').style.display = 'block';
    document.getElementById('forgotForm').style.display = 'none';
  }
});
</script>
</body>
</html>
