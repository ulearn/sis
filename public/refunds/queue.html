<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Refund Requests — ULearn SIS</title>
<link rel="icon" type="image/png" href="/sis/public/favicon.ico?v=2">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f4f3f0; --card: #fff; --border: #e5e4e0;
  --text: #1a1d23; --muted: #6b6e76; --subtle: #9b9ea6;
  --accent: #2563eb; --accent-hover: #1d4ed8;
  --danger: #dc2626; --success: #059669; --warning: #d97706;
  --radius: 6px;
}
body { font-family: 'DM Sans', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; padding: 24px; }
.shell { max-width: 1400px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.subtitle { color: var(--muted); margin-bottom: 20px; }

.toolbar {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--card); padding: 14px 16px; border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 16px;
}
.toolbar label { font-size: 12px; color: var(--muted); font-weight: 500; }
.toolbar select, .toolbar input {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; background: #fff; min-width: 140px;
}
.toolbar .spacer { flex: 1; }

button {
  padding: 7px 14px; border: 1px solid var(--border); background: #fff;
  border-radius: 4px; cursor: pointer; font: inherit; font-size: 13px;
  transition: 120ms;
}
button:hover { background: #f9f9f7; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: var(--accent-hover); }
button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--border); background: #fafaf8; font-weight: 600; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr.row { cursor: pointer; }
tr.row:hover { background: #fafaf8; }

.status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.status.pending_review { background: #fef3c7; color: #92400e; }
.status.approved { background: #dbeafe; color: #1e40af; }
.status.sent_to_tm { background: #d1fae5; color: #065f46; }
.status.rejected { background: #fee2e2; color: #991b1b; }

.terr { font-size: 12px; color: var(--muted); }
.amt { font-family: 'DM Sans', monospace; }
.age { font-size: 12px; color: var(--subtle); }

.empty { padding: 40px; text-align: center; color: var(--muted); }
.bulk-bar { display: none; align-items: center; gap: 12px; padding: 10px 16px; background: #eff3fe; border: 1px solid #c7d2fe; border-radius: var(--radius); margin-bottom: 12px; }
.bulk-bar.active { display: flex; }
.bulk-bar .count { font-weight: 600; }
</style>
</head>
<body>
<div class="shell">
  <h1>Refund Requests</h1>
  <p class="subtitle">Review and approve refund requests. Approved requests trigger an email to TransferMate with the visa refusal letter attached.</p>

  <div class="toolbar">
    <label>Status</label>
    <select id="filter-status">
      <option value="pending_review" selected>Pending review</option>
      <option value="approved">Approved (not yet sent)</option>
      <option value="sent_to_tm">Sent to TM</option>
      <option value="rejected">Rejected</option>
      <option value="all">All</option>
    </select>
    <label>Territory</label>
    <select id="filter-territory">
      <option value="">Any</option>
      <option>EU</option>
      <option>Non-EU (VBD)</option>
      <option>Non-EU (No Visa)</option>
      <option>Unsupported Territory</option>
    </select>
    <label>Reason</label>
    <select id="filter-reason">
      <option value="">Any</option>
      <option value="visa_refusal">Visa refusal</option>
      <option value="operational_service">Operational — service</option>
      <option value="operational_satisfaction">Operational — satisfaction</option>
      <option value="operational_cancellation">Operational — cancellation</option>
      <option value="other">Other</option>
    </select>
    <div class="spacer"></div>
    <button id="export-csv">Export CSV</button>
    <button id="refresh">Refresh</button>
  </div>

  <div class="bulk-bar" id="bulk-bar">
    <span class="count" id="bulk-count">0 selected</span>
    <button class="primary" id="bulk-approve">Approve & send to TransferMate</button>
    <button id="bulk-clear">Clear</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:32px"><input type="checkbox" id="select-all"></th>
          <th>#</th>
          <th>Received</th>
          <th>Student</th>
          <th>Territory / Reason</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No requests match the current filters.</div>
  </div>
</div>

<script>
const API = '/sis/api/refunds';

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('en-IE', { day: '2-digit', month: 'short', year: 'numeric' });
}
function ageDays(s) {
  if (!s) return 0;
  return Math.floor((Date.now() - new Date(s).getTime()) / 86400000);
}
function fmtReason(r) {
  return ({
    visa_refusal: 'Visa refusal',
    operational_service: 'Op — service',
    operational_satisfaction: 'Op — satisfaction',
    operational_cancellation: 'Op — cancellation',
    other: 'Other',
  })[r] || r;
}

let rows = [];
const selected = new Set();

async function load() {
  const params = new URLSearchParams();
  const status = document.getElementById('filter-status').value;
  const territory = document.getElementById('filter-territory').value;
  const reason = document.getElementById('filter-reason').value;
  if (status) params.set('status', status);
  if (territory) params.set('territory', territory);
  if (reason) params.set('reason', reason);

  const r = await fetch(API + '?' + params.toString(), { credentials: 'same-origin' });
  if (r.status === 401) { location.href = '/sis/login'; return; }
  rows = await r.json();
  render();
}

function render() {
  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');
  if (!rows.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    updateBulkBar();
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = rows.map(r => {
    const studentLabel = r.student
      ? `${r.student.firstName ?? ''} ${r.student.lastName ?? ''}`.trim() + ` <span class="terr">&lt;${r.student.email}&gt;</span>`
      : r.studentName + ` <span class="terr">&lt;${r.studentEmail}&gt;</span>`;
    const isPending = r.status === 'pending_review';
    return `<tr class="row" data-id="${r.id}">
      <td><input type="checkbox" class="row-check" data-id="${r.id}" ${isPending ? '' : 'disabled'} ${selected.has(r.id) ? 'checked' : ''}></td>
      <td>#${r.id}</td>
      <td>${fmtDate(r.createdAt)}</td>
      <td>${studentLabel}<div class="terr">${r.nationality}</div></td>
      <td>${r.territory}<div class="terr">${fmtReason(r.refundReason)}</div></td>
      <td class="amt">${r.amountRequested ? '€' + r.amountRequested : '—'}</td>
      <td><span class="status ${r.status}">${r.status.replace(/_/g, ' ')}</span></td>
      <td class="age">${ageDays(r.createdAt)}d</td>
    </tr>`;
  }).join('');

  document.querySelectorAll('tr.row').forEach(tr => {
    tr.addEventListener('click', (e) => {
      if (e.target.matches('input[type="checkbox"]')) return;
      location.href = '/sis/refunds/' + tr.dataset.id;
    });
  });
  document.querySelectorAll('.row-check').forEach(cb => {
    cb.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(cb.dataset.id, 10);
      if (cb.checked) selected.add(id); else selected.delete(id);
      updateBulkBar();
    });
  });
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  const count = document.getElementById('bulk-count');
  if (selected.size) {
    bar.classList.add('active');
    count.textContent = `${selected.size} selected`;
  } else {
    bar.classList.remove('active');
  }
}

document.getElementById('select-all').addEventListener('change', (e) => {
  const checks = document.querySelectorAll('.row-check:not(:disabled)');
  checks.forEach(cb => {
    cb.checked = e.target.checked;
    const id = parseInt(cb.dataset.id, 10);
    if (e.target.checked) selected.add(id); else selected.delete(id);
  });
  updateBulkBar();
});

document.getElementById('filter-status').addEventListener('change', () => { selected.clear(); load(); });
document.getElementById('filter-territory').addEventListener('change', load);
document.getElementById('filter-reason').addEventListener('change', load);
document.getElementById('refresh').addEventListener('click', load);
document.getElementById('bulk-clear').addEventListener('click', () => { selected.clear(); render(); });

document.getElementById('bulk-approve').addEventListener('click', async () => {
  if (!selected.size) return;
  if (!confirm(`Approve and email TransferMate for ${selected.size} request(s)? This sends the email immediately.`)) return;
  const r = await fetch(API + '/batch-approve', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: Array.from(selected) }),
  });
  const out = await r.json();
  const failed = (out.results || []).filter(x => !x.ok);
  alert(`Approved: ${out.results.length - failed.length}. Failed: ${failed.length}${failed.length ? '\n' + failed.map(f => `#${f.id}: ${f.error}`).join('\n') : ''}`);
  selected.clear();
  load();
});

document.getElementById('export-csv').addEventListener('click', () => {
  const headers = ['id', 'received', 'student', 'email', 'nationality', 'territory', 'reason', 'amount', 'status'];
  const csv = [headers.join(',')].concat(rows.map(r => [
    r.id,
    r.createdAt,
    `"${(r.student ? (r.student.firstName + ' ' + (r.student.lastName ?? '')) : r.studentName).replace(/"/g, '""')}"`,
    r.studentEmail,
    r.nationality,
    r.territory,
    r.refundReason,
    r.amountRequested ?? '',
    r.status,
  ].join(','))).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'refunds-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
});

load();
</script>
</body>
</html>
