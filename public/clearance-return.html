<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment received</title>
<style>
  html,body{margin:0;height:100%;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:#fff;color:#10151f}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .tick{width:52px;height:52px;border-radius:50%;background:#e9f7e0;color:#2e9e00;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  h1{font-size:18px;font-weight:800;margin:0 0 4px}
  p{font-size:13px;color:#6b7280;margin:0}
</style>
</head>
<body>
  <div class="wrap">
    <div class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h1>Seats reserved</h1>
    <p>Your deposit is in — these seats are yours. You can close this window.</p>
  </div>
  <script>
    // Belt-and-braces: tell the portal to close the checkout + refresh. The portal
    // also polls checkout-status, so confirmation happens either way.
    try { window.top.postMessage({ type: 'clearance-paid' }, '*'); } catch (e) {}
  </script>
</body>
</html>
