<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/sis/public/favicon.ico?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULearn — Partner Portal Registration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f3f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 440px;
    padding: 40px 40px 32px;
  }
  .logo {
    text-align: center;
    margin-bottom: 6px;
    font-size: 24px;
    font-weight: 800;
    color: #1a1d23;
    letter-spacing: -0.02em;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #339900;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .intro {
    text-align: center;
    font-size: 13px;
    color: #64748b;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: #1e293b;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: #339900;
    box-shadow: 0 0 0 4px rgba(51, 153, 0, 0.08);
  }
  .hint {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
    line-height: 1.4;
  }
  button {
    width: 100%;
    padding: 13px;
    background: #339900;
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    box-shadow: 0 8px 20px rgba(51, 153, 0, 0.25);
    margin-top: 8px;
  }
  button:hover { background: #2d8600; transform: translateY(-1px); }
  button:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }
  .error {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .success {
    background: #d1fae5;
    color: #065f46;
    padding: 16px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }
  .footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #9b9ea6;
  }
  .footer-note a { color: #339900; text-decoration: none; font-weight: 600; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
  <div class="logo">ULearn</div>
  <div class="subtitle">Partner Portal — Create Account</div>
  <div class="intro">Use your work email (the one we already have on file). We'll link your account to your agency automatically.</div>

  <div class="error" id="error"></div>
  <div class="success" id="success">
    <strong>Account created!</strong><br>
    <span style="font-size:13px">Redirecting to login...</span>
  </div>

  <form id="regForm">
    <div class="field">
      <label for="email">Work Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required autofocus>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required minlength="3">
      <div class="hint">Choose a short unique login name (no spaces).</div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      <div class="hint">Minimum 8 characters.</div>
    </div>
    <button type="submit" id="submitBtn">Create Account</button>
  </form>

  <div class="footer-note">
    Already registered? <a href="/sis/partners/login">Sign in →</a>
  </div>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  const okEl = document.getElementById('success');
  const btn = document.getElementById('submitBtn');
  errEl.style.display = 'none';
  okEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Checking your email...';

  try {
    const res = await fetch('/sis/partners/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim().toLowerCase(),
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (data.success) {
      okEl.style.display = 'block';
      setTimeout(() => { window.location.href = '/sis/partners/login'; }, 2000);
    } else {
      errEl.textContent = data.error || 'Registration failed';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  } catch (err) {
    errEl.textContent = 'Connection error — please try again';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
