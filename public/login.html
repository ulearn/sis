<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/sis/public/favicon.ico?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULearn SIS - Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f3f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .login-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 380px;
    padding: 40px;
  }
  .logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 22px;
    font-weight: 700;
    color: #1a1d23;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #9b9ea6;
    margin-bottom: 32px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4a4d56;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #6FB42C; }
  .pw-wrap { position: relative; margin-bottom: 16px; }
  .pw-wrap input { margin-bottom: 0; padding-right: 40px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 32px; height: 32px;
    background: transparent; border: 0; padding: 0;
    cursor: pointer; font-size: 18px; line-height: 1;
    color: #9b9ea6; opacity: 0.85;
  }
  .pw-toggle:hover { opacity: 1; }
  .pw-toggle:active { transform: translateY(-50%) scale(0.94); }
  button {
    width: 100%;
    padding: 11px;
    background: #6FB42C;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #5d9c24; }
  .error {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">ULearn Student System</div>
  <div class="error" id="error"></div>
  <form id="loginForm">
    <label for="username">Username</label>
    <!-- inputmode="text" + no restrictive autocomplete keeps Gboard/SwiftKey
         glide-typing enabled. autocapitalize/spellcheck off so usernames
         aren't "corrected". autocomplete is unset (rather than =off or
         =username) so password managers still match via form heuristics. -->
    <input type="text" id="username" name="username" required autofocus
           inputmode="text" autocapitalize="none" spellcheck="false">
    <label for="password">Password</label>
    <!-- Password glide-typing is disabled by the OS for type="password" on
         both iOS and Android. The eye toggle briefly switches to type="text"
         so a student who wants to glide can — defaults stay masked. -->
    <div class="pw-wrap">
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" aria-label="Show password"
              onclick="togglePassword(this)">👁</button>
    </div>
    <button type="submit">Sign In</button>
    <div style="text-align:center;margin-top:16px;font-size:13px;">
      <a href="/sis/forgot" style="color:#6FB42C;text-decoration:none;font-weight:600">Forgot password?</a>
      <span style="color:#9b9ea6;margin:0 8px">|</span>
      <a href="/sis/register" style="color:#6FB42C;text-decoration:none;font-weight:600">Create account</a>
    </div>
  </form>
</div>
<script>
function togglePassword(btn) {
  const input = document.getElementById('password');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🙈';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/sis/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.success) {
      // Honour ?next=… (set by the LMS auth-guard when bouncing unauthenticated
      // visitors here) over the role-default returned by the server. Restrict
      // to same-origin paths so a hostile next= can't redirect off-site.
      const next = new URLSearchParams(location.search).get('next');
      const safeNext = next && /^\/[a-zA-Z0-9_\-./?=&%]*$/.test(next) ? next : null;
      window.location.href = safeNext || data.redirectTo || '/sis/admin';
    } else {
      errEl.textContent = data.error || 'Invalid credentials';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = 'Connection error';
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
