<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seat Clearance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#f6f8f4;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;color:#1a1a2e}
  .wrap{max-width:920px;margin:0 auto;padding:16px 14px 22px}
</style>
</head>
<body>
  <!-- Identical UI to the partner portal's Seat Clearance tab — rendered by the SAME shared
       script (public mode). Reserve Now opens the portal to log in. -->
  <div class="wrap"><div id="clearanceBody"><div style="padding:48px;text-align:center;color:#6b7280">Loading…</div></div></div>
  <script>window.CLEARANCE_MODE = 'public';</script>
  <script src="/sis/partners/public/clearance-render.js"></script>
  <script>
    loadClearance();
    // Auto-resize: broadcast our height so the parent (ulearnschool.com) iframe sizes to content.
    function postHeight(){ try{ var h = document.querySelector('.wrap').offsetHeight + 24; parent.postMessage({ clrClearanceHeight: h }, '*'); }catch(e){} }
    window.addEventListener('load', postHeight);
    window.addEventListener('resize', postHeight);
    [300, 1000, 2500].forEach(function(t){ setTimeout(postHeight, t); });
  </script>
</body>
</html>
